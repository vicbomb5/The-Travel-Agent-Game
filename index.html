function renderPlanScreen(){
  const c = state.client;
  maybeTriggerNegotiation();
  const spend = tripSpend();
  const over = spend.total > c.budgetTotal;
  if(!state.planTab) state.planTab = "book";
  const day = state.days.find(d=>d.dayNumber===state.currentDay);
  const park = day.park;
  const isRest = day.dayType==="rest";
  const trayParkCode = (day.secondPark && state.trayPark==="second") ? day.secondPark : park;
  const isDS = trayParkCode==="DS" && !isRest;
  const allParkRides = RIDES[trayParkCode]||[];
  const rideList = allParkRides.filter(r=>r.type!=="show" && r.type!=="fireworks");
  const showList = allParkRides.filter(r=>r.type==="show");
  const fireworksList = allParkRides.filter(r=>r.type==="fireworks");
  const diningList = RESTAURANTS[trayParkCode]||[];

  const rideIcon = (r)=> r.type==="meetgreet" ? "🤝" : r.type==="water" ? "🌊" : r.thrill==="intense" ? "🎢" : r.thrill==="moderate" ? "🎡" : "🎠";
  const diningIcon = (d)=> d.type==="character" ? "👑" : d.type==="TS" ? "🍽️" : "🥤";

  const isSelected = (kind,id)=> state.selectedCard && state.selectedCard.kind===kind && state.selectedCard.id===id;
  const showRides = state.trayFilter==="all" || state.trayFilter==="ride";
  const showShows = state.trayFilter==="all" || state.trayFilter==="show";
  const showFireworks = state.trayFilter==="all" || state.trayFilter==="fireworks";
  const showDining = state.trayFilter==="all" || state.trayFilter==="dining";
  const showSnacks = state.trayFilter==="all" || state.trayFilter==="snack";
  const showShop = state.trayFilter==="all" || state.trayFilter==="shop";

  const trayItems = (isRest || isDS || !showRides) ? "" : rideList.map(r=>{
    const closed = isRideClosedToday(day, r);
    return `
    <div class="card ${r.ll==='ill'?'ill':''} ${isSelected('ride',r.id)?'selected':''} ${closed?'closed':''}" draggable="${(closed||IS_TOUCH_DEVICE)?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('ride',r.id)}" aria-disabled="${closed}" data-kind="ride" data-id="${r.id}" ${closed?'data-disabled="true"':''}>
      <div class="name">${rideIcon(r)} ${r.name}${r.tier?` <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${r.tier==='A'?'var(--rust-light)':'var(--teal-light)'};color:${r.tier==='A'?'var(--rust)':'var(--teal-dark)'};">${r.tier} tier</span>`:''}</div>
      <div class="meta"><span>${closed ? '⛔ Closed today' : (r.type==='meetgreet'?'Meet & Greet':r.thrill)+(r.height?` · ${r.height}in+`:'')}</span><span>${closed?'':(r.ll==='ill'?'ILL':r.ll==='multipass'?'Multi Pass':'Standby')}</span></div>
    </div>`;
  }).join("");
  const trayShows = (isRest || isDS || !showShows) ? "" : showList.map(r=>`
    <div class="card ${isSelected('ride',r.id)?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('ride',r.id)}" data-kind="ride" data-id="${r.id}">
      <div class="name">🎭 ${r.name}</div>
      <div class="meta"><span>Show</span><span>Standby</span></div>
    </div>`).join("");
  const trayFireworks = (isRest || isDS || !showFireworks) ? "" : fireworksList.map(r=>`
    <div class="card ${isSelected('ride',r.id)?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('ride',r.id)}" data-kind="ride" data-id="${r.id}" style="border-left:4px solid var(--pop);">
      <div class="name">🎆 ${r.name}</div>
      <div class="meta"><span>Only at ${FIREWORKS_TIME}</span><span>Free</span></div>
    </div>`).join("") || (showFireworks && !isRest && !isDS ? `<p class="sans" style="font-size:11.5px;color:#8a8267;">No fireworks show at this park.</p>` : "");
  const trayDining = isRest
    ? (showDining ? `
      <div class="card dining ${isSelected('hotelDining','hotel_dining')?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('hotelDining','hotel_dining')}" data-kind="hotelDining" data-id="hotel_dining">
        <div class="name">🍽️ Hotel dining</div>
        <div class="meta"><span>Quick service${HOTEL_DINING[state.hotelId]?' or a signature restaurant':''}</span><span>Pick on booking</span></div>
      </div>` : "")
    : (!showDining ? "" : diningList.map(rest=>`
      <div class="card dining ${isSelected('dining',rest.id)?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('dining',rest.id)}" data-kind="dining" data-id="${rest.id}">
        <div class="name">${diningIcon(rest)} ${rest.name}</div>
        <div class="meta"><span>${rest.type}</span><span>${fmtMoney(priceInRange(rest.price,"Medium"))}/pp</span></div>
      </div>`).join(""));
  const traySnack = (isRest || !showSnacks) ? "" : `
    <div class="card dining ${isSelected('snack','snack_cart')?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('snack','snack_cart')}" data-kind="snack" data-id="snack_cart">
      <div class="name">🍿 Snack cart</div>
      <div class="meta"><span>Churro, popcorn, pretzel & more</span><span>Pick on booking</span></div>
    </div>`;
  const trayShop = (isRest || !showShop) ? "" : `
    <div class="card dining ${isSelected('shop','shop_cart')?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('shop','shop_cart')}" data-kind="shop" data-id="shop_cart">
      <div class="name">🛍️ Souvenir stand</div>
      <div class="meta"><span>Keepsakes, plush, apparel & more</span><span>Pick on booking</span></div>
    </div>`;
  const trayActivities = !isRest ? "" : `
    <div class="card dining ${isSelected('activity','resort_activities')?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('activity','resort_activities')}" data-kind="activity" data-id="resort_activities">
      <div class="name">🏖️ Resort activities</div>
      <div class="meta"><span>Pool, fishing${RESORT_ACTIVITIES.resort_spa.availableAt.includes(state.hotelId)?', spa':''}</span><span>Pick length & booking</span></div>
    </div>`;

  const dayHours = hoursForDay(day);
  const slots = dayHours.map(h=>{
    const item = day.items[h];
    let content, dropAttrs = `data-slot="${h}" role="button" tabindex="0" aria-label="${h} — ${item?item.name:(state.selectedCard?'Tap to place '+state.selectedCard.label:'Empty')}"`;
    if(!item){
      const isReserved = state.curveballDay===day.dayNumber && state.brokenSlotHour===h;
      if(isReserved){
        content = `<span style="color:#8a1f3a; font-size:11.5px; font-family:var(--sans); font-weight:600;">🚫 Reserved — early break</span>`;
        dropAttrs = `role="button" tabindex="0" aria-label="${h} — reserved for an early break"`;
      } else {
        content = state.selectedCard
          ? `<span style="color:var(--teal); font-size:11.5px; font-family:var(--sans); font-weight:600;">Tap to place "${state.selectedCard.label}"</span>`
          : `<span style="color:#c9bd9c; font-size:11.5px; font-family:var(--sans);">+ Drag or tap-to-place</span>`;
      }
    }
    else if(item.kind==="spanned"){
      content = `<div class="stub" style="background:transparent;border-style:solid;opacity:.5;font-size:11px;">continues from ${item.parentHour}</div>`;
      dropAttrs = ""; // not a drop target, part of the ride above
    }
    else if(item.kind==="ride"){
      const llDown = isLLDownToday(day);
      content = `<div class="stub"><div><b>${item.name}</b>${item.span===2?' <span style="font-size:10px;color:#7a5314;">(2 hr)</span>':''}${item.tier?` <span style="font-size:10px;color:#7a5314;">[${item.tier} tier]</span>`:''}<div class="wait">${item.wait} min standby${llDown ? ` · <span style="color:#8a1f3a;">LL down today</span>` : item.llType!=='none'?` · <a href="#" data-ll-toggle="${h}" style="color:var(--teal-dark);">${item.llUsed?`LL used (${fmtMoney(item.price)})`:'Use Lightning Lane'}</a>`:''}</div></div><button data-remove="${h}" aria-label="Remove">&times;</button></div>`;
    } else if(item.kind==="travel"){
      content = `<div class="stub" style="background:var(--rust-light);border-color:var(--rust);"><div><b>${item.name}</b><div class="wait">Switching parks</div></div><button data-remove="${h}" aria-label="Remove">&times;</button></div>`;
    } else if(item.kind==="activity"){
      const icon = item.id==="resort_fishing" ? "🎣" : item.id==="resort_spa" ? "💆" : "🏊";
      content = `<div class="stub dining"><div><b>${icon} ${item.name}</b><div class="wait">${item.price ? fmtMoney(item.price) : 'Free — resort amenity'}</div></div><button data-remove="${h}" aria-label="Remove">&times;</button></div>`;
    } else {
      content = `<div class="stub dining"><div><b>${item.name}</b><div class="wait">${fmtMoney(item.price)}/pp</div></div><button data-remove="${h}" aria-label="Remove">&times;</button></div>`;
    }
    return `<div class="slot-row"><div class="slot-time">${h}</div><div class="slot-drop${(!item && state.curveballDay===day.dayNumber && state.brokenSlotHour===h)?' reserved-slot':''}" ${dropAttrs}>${content}</div></div>`;
  }).join("");

  const isExtendedHoursDay = state.curveballDay===day.dayNumber && state.curveballLabel==="Surprise extended evening hours";
  const isRainDay = state.curveballDay===day.dayNumber && state.curveballLabel==="Afternoon rain moves in";
  const rainOverlay = isRainDay ? `<div class="rain-overlay">${Array.from({length:36}).map(()=>{
    const left = Math.random()*100;
    const dur = (0.6 + Math.random()*0.6).toFixed(2);
    const delay = (Math.random()*1.2).toFixed(2);
    return `<span class="raindrop" style="left:${left}%; animation-duration:${dur}s; animation-delay:-${delay}s;"></span>`;
  }).join("")}</div>` : "";
  const curveballBanner = state.curveballDay===day.dayNumber
    ? (isExtendedHoursDay
        ? `<div class="curveball-banner" style="background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);">✨ Curveball — Surprise extended evening hours! The park stays open until 11 PM today — two extra hour slots just opened up below.</div>`
        : state.curveballLabel==="A planned ride breaks down"
        ? `<div class="curveball-banner">⛔ Curveball — ${(()=>{ const r=Object.values(RIDES).flat().find(r=>r.id===state.brokenRideId); return r?r.name:"A ride"; })()} has broken down and is closed for the day. It's grayed out in the tray below.</div>`
        : state.curveballLabel==="A little one needs an early break"
        ? `<div class="curveball-banner">😴 Curveball — the family needs an early break today. The ${state.brokenSlotHour} slot is reserved and can't be booked.</div>`
        : isRainDay
        ? `<div class="curveball-banner">🌧️ Curveball — Afternoon rain moves in. Water rides are closed for the day — they're grayed out in the tray below.</div>`
        : state.curveballLabel==="Lightning Lane system goes down"
        ? `<div class="curveball-banner">📵 Curveball — Lightning Lane's booking system is down park-wide today. No Multi Pass or Individual Lightning Lane — every ride is standby-only.</div>`
        : state.curveballLabel==="Massive crowd surge"
        ? `<div class="curveball-banner">👥 Curveball — A massive crowd surge hit the park today. Standby waits are running well above normal on everything.</div>`
        : `<div class="curveball-banner">Curveball — ${state.curveballLabel}. Plan around it today.</div>`)
    : "";
  const opportunityBanner = state.opportunityDay===day.dayNumber
    ? `<div class="curveball-banner" style="background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);">Opportunity — Individual Lightning Lane rides are 30% off today only. Worth grabbing one.</div>` : "";
  const textBanner = (state.textDay===day.dayNumber && !state.textResolved)
    ? `<div class="curveball-banner" style="background:var(--pop-light);border-color:var(--pop);color:#8a1f3a;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <span>📱 Text from the family: "${state.textMessage}"</span>
        <span style="display:flex;gap:6px;"><button class="btn secondary" id="declineTextBtn" style="font-size:11px;padding:6px 12px;">Not today</button><button class="btn" id="acceptTextBtn" style="font-size:11px;padding:6px 12px;">Make it a rest day</button></span>
      </div>` : "";
  const llLimitBanner = state.llLimitMsg
    ? `<div class="curveball-banner">${state.llLimitMsg}</div>` : "";

  const moodTagSet = bookedTagSet();
  const metSoFar = c.mustHaves.filter(t=>moodTagSet.tags.has(t)).length;
  const metPct = metSoFar/c.mustHaves.length;
  const mood = over ? {emoji:"😟",label:"Worried about the budget"}
    : metPct>=0.8 ? {emoji:"😄",label:"Delighted so far"}
    : metPct>=0.4 ? {emoji:"🙂",label:"Cautiously optimistic"}
    : {emoji:"😐",label:"Still waiting to see the plan"};
  const hintsOn = DIFFICULTY[difficulty].hintsOn;
  const hintBanner = state.hintMsg ? `<div class="curveball-banner" style="background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);">💡 ${state.hintMsg}</div>` : "";

  const tabDefs = [["book","📋 Book"],["setup","🏨 Trip Setup"],["brief","🗂️ Client Brief"],["messages",`💬 Messages${(state.negotiation.triggered && !state.negotiation.resolved) ? ' •' : ''}`],["budget","💰 Budget"]];
  const subnav = `<div class="subnav">${tabDefs.map(([k,label])=>`<button data-plan-tab="${k}" class="${state.planTab===k?'on':''}">${label}</button>`).join("")}</div>`;

  let tabContent = "";
  if(state.planTab==="book"){
    tabContent = `
    <div class="tabs">
      ${state.days.map(d=>`<div class="tab ${d.dayNumber===state.currentDay?'active':''}" data-day="${d.dayNumber}">Day ${d.dayNumber}${Object.keys(d.items).length?'<span class="dot"></span>':''}</div>`).join("")}
    </div>
    <div class="day-controls">
      <label>Day type:
        <select id="dayTypeSelect">
          <option value="park" ${day.dayType!=='rest'?'selected':''}>Park day</option>
          <option value="rest" ${day.dayType==='rest'?'selected':''}>Rest day at hotel (no ticket cost)</option>
        </select>
      </label>
      ${day.dayType!=='rest' ? `<label>Park:
        <select id="parkSelect">
          ${Object.keys(PARK_NAMES).map(p=>`<option value="${p}" ${p===park?'selected':''}>${PARK_NAMES[p]}</option>`).join("")}
        </select>
      </label>
      <span class="crowd-tag crowd-${day.crowdSeed}">${day.crowdSeed} crowd day</span>
      ${(state.parkHopper && !WATER_PARKS.includes(park)) ? `<label>Hop to:
        <select id="secondParkSelect">
          <option value="">None today</option>
          ${Object.keys(PARK_NAMES).filter(p=>p!==park && !WATER_PARKS.includes(p)).map(p=>`<option value="${p}" ${p===day.secondPark?'selected':''}>${PARK_NAMES[p]}</option>`).join("")}
        </select>
      </label>` : ''}` : ''}
      ${curveballBanner}
      ${opportunityBanner}
      ${textBanner}
      ${llLimitBanner}
    </div>
    <div class="planner">
      <div class="tray">
        <h3>Available</h3>
        ${day.secondPark ? `<div class="tray-filter">
          <button data-tray-park="home" class="${state.trayPark==='home'?'on':''}">${PARK_NAMES[park]}</button>
          <button data-tray-park="second" class="${state.trayPark==='second'?'on':''}">${PARK_NAMES[day.secondPark]}</button>
        </div>` : ''}
        <div class="tray-filter">
          <button data-filter="all" class="${state.trayFilter==='all'?'on':''}">All</button>
          <button data-filter="ride" class="${state.trayFilter==='ride'?'on':''}">Rides</button>
          <button data-filter="show" class="${state.trayFilter==='show'?'on':''}">Shows</button>
          <button data-filter="dining" class="${state.trayFilter==='dining'?'on':''}">Dining</button>
          <button data-filter="snack" class="${state.trayFilter==='snack'?'on':''}">Snacks</button>
          <button data-filter="fireworks" class="${state.trayFilter==='fireworks'?'on':''}">🎆 Fireworks</button>
          <button data-filter="shop" class="${state.trayFilter==='shop'?'on':''}">🛍️ Shop</button>
        </div>
        ${day.secondPark ? `<div class="card ${isSelected('travel','travel')?'selected':''}" draggable="${IS_TOUCH_DEVICE?'false':'true'}" role="button" tabindex="0" aria-pressed="${isSelected('travel','travel')}" data-kind="travel" data-id="travel" style="border-left:4px solid var(--rust);">
          <div class="name">Travel to ${state.trayPark==='home'?PARK_NAMES[day.secondPark]:PARK_NAMES[park]}</div>
          <div class="meta"><span>~1 hr commute</span><span>Drag or tap, then tap a slot</span></div>
        </div>` : ''}
        ${trayItems}${trayShows}${trayFireworks}${trayDining}${traySnack}${trayShop}${trayActivities}
      </div>
      <div class="timeline">${rainOverlay}${slots}</div>
    </div>`;
  } else if(state.planTab==="setup"){
    const currentHotel = HOTELS.find(h=>h.id===state.hotelId);
    const roomFits = currentHotel && ROOM_TYPES[state.roomType] && ROOM_TYPES[state.roomType].capacity>=c.size;
    tabContent = `
    <div class="home-panels" style="max-width:none;">
      <div class="home-panel">
        <h3>Hotel & Room</h3>
        <label style="display:block;">
          <select id="hotelSelect" style="width:100%;margin-top:6px;">
            ${HOTELS.map(h=>{
              const fits = smallestFittingRoomType(h, c.size);
              return `<option value="${h.id}" ${h.id===state.hotelId?'selected':''} ${!fits?'disabled':''}>${h.name} — ${h.tier}${h.earlyEntry?' ⏰':''} (${fmtMoney(priceInRange(h.price,"Medium"))}/night)${!fits?' — too small for this party':''}</option>`;
            }).join("")}
          </select>
        </label>
        <label style="display:block;margin-top:10px;">
          <select id="roomTypeSelect" style="width:100%;">
            ${(currentHotel?currentHotel.roomTypes:["standard"]).map(rt=>{
              const rd = ROOM_TYPES[rt];
              const fits = rd.capacity>=c.size;
              const nightly = currentHotel ? Math.round(priceInRange(currentHotel.price,"Medium")*rd.priceMult) : 0;
              return `<option value="${rt}" ${state.roomType===rt?'selected':''} ${!fits?'disabled':''}>${rd.label} — sleeps ${rd.capacity} (${fmtMoney(nightly)}/night)${!fits?' — too small':''}</option>`;
            }).join("")}
          </select>
        </label>
        ${!roomFits ? `<p style="margin-top:8px;font-size:11.5px;color:var(--rust);">⚠️ This room doesn't fit all ${c.size} guests — pick a bigger room type.</p>` : ''}
        <p style="margin-top:12px;font-size:11.5px;color:#8a8267;">Applies to all ${c.tripLengthDays} nights of the trip. ⏰ Early Entry hotels cut wait times in the first two hours of any park day.</p>
        <div class="sound-row" style="margin-top:16px;">
          <label><input type="checkbox" id="hopperToggle" ${state.parkHopper?'checked':''}> Park Hopper</label>
        </div>
        <p style="font-size:11.5px;color:#8a8267;">+${fmtMoney(PARK_HOPPER_FEE[0])}–${fmtMoney(PARK_HOPPER_FEE[1])}/person, one time. Once on, you can pick a second park for any day from the Book tab.</p>
      </div>
      <div class="home-panel">
        <h3>Trip at a glance</h3>
        <p style="font-size:11.5px;color:#8a8267;margin-top:0;"><b>Season:</b> ${SEASONS[state.season].label} — ${SEASONS[state.season].note}${FESTIVALS[state.season] ? ` 🎪 Epcot is hosting the ${FESTIVALS[state.season].name} — check the Snacks tab there.` : ''}</p>
        ${state.days.map(d=>`
          <div class="day-overview-row">
            <span><b>Day ${d.dayNumber}</b></span>
            <span>${d.dayType==='rest' ? 'Resting at hotel' : PARK_NAMES[d.park] + (d.secondPark ? ' + '+PARK_NAMES[d.secondPark] : '')}</span>
            <span class="crowd-tag crowd-${d.crowdSeed}">${d.crowdSeed}</span>
          </div>`).join("")}
      </div>
      <div class="home-panel">
        <h3>Extras</h3>
        <div class="sound-row">
          <label><input type="checkbox" id="photoPassToggle" ${state.photoPass?'checked':''}> Memory Maker (PhotoPass)</label>
          <span>${fmtMoney(PHOTOPASS_PRICE)}</span>
        </div>
        <p style="font-size:11.5px;color:#8a8267;">One-time, unlimited photos all trip. A nice touch for photo-loving families.</p>
        <label style="display:block;margin-top:14px;">Ticketed after-hours event:
          <select id="eventTicketSelect" style="width:100%;margin-top:6px;">
            ${Object.keys(EVENTS).map(k=>`<option value="${k}" ${state.eventTicket===k?'selected':''}>${EVENTS[k].label}${EVENTS[k].fee?` (+${fmtMoney(EVENTS[k].fee)}/person)`:''}</option>`).join("")}
          </select>
        </label>
        <p style="font-size:11.5px;color:#8a8267;">Adds exclusive treats to the Snacks tab for the whole trip.</p>
      </div>
    </div>`;
  } else if(state.planTab==="brief"){
    tabContent = `
    <div class="brief-panel">
      <h3>${c.familyName}</h3>
      <p class="sans" style="font-size:13px;color:#5b5646;">${c.archetype.flavor}</p>
      ${c.quirk ? `<p class="sans" style="font-size:12.5px;color:var(--rust);background:var(--rust-light);border-radius:8px;padding:8px 12px;">📝 ${c.quirk.text}</p>` : ''}
      ${c.hotelPreference ? `<p class="sans" style="font-size:12.5px;color:var(--mustard-deep);background:var(--mustard-light);border-radius:8px;padding:8px 12px;margin-top:6px;">🏨 They ${c.hotelPreference.label}.</p>` : ''}
      <div class="sans" style="font-size:12px;margin-top:14px;">
        <b style="display:block;text-transform:uppercase;color:var(--teal-dark);margin-bottom:4px;">Must-haves</b>
        <div class="pill-list">${c.mustHaves.map(t=>`<span class="pill want">${TAG_LABELS[t]||t}</span>`).join("")}</div>
      </div>
      <div class="sans" style="font-size:12px;margin-top:12px;">
        <b style="display:block;text-transform:uppercase;color:var(--rust);margin-bottom:4px;">Dealbreakers</b>
        <div class="pill-list">${c.dealbreakers.length? c.dealbreakers.map(t=>`<span class="pill avoid">${TAG_LABELS[t]||t}</span>`).join("") : '<span class="pill avoid">None stated</span>'}</div>
      </div>
      <div class="client-row" style="margin-top:16px;">
        <div><b>Party size</b>${c.size} guests</div>
        <div><b>Trip length</b>${c.tripLengthDays} days</div>
        <div><b>Budget</b>${fmtMoney(c.budgetTotal)} (${c.budgetTier})</div>
        <div><b>Lightning Lane style</b>${c.llAttitude.replace(/_/g,' ')}</div>
      </div>
    </div>`;
  } else if(state.planTab==="messages"){
    const n = state.negotiation;
    tabContent = `
    <div class="brief-panel">
      <h3>Messages</h3>
      ${!n.triggered ? `
        <p class="sans" style="font-size:13px;color:#8a8267;">No messages yet — the family will check in once you're roughly halfway through planning their trip.</p>
      ` : !n.resolved ? `
        <div class="curveball-banner" style="background:var(--pop-light);border-color:var(--pop);color:#8a1f3a;">📱 "${n.message}"</div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
          ${n.concernType==="budget" ? `
            <button class="btn secondary" id="negoReassureBtn">Reassure them — hold the plan</button>
            <button class="btn" id="negoGoodwillBtn">Offer a small goodwill gesture</button>
          ` : n.concernType==="musthave" ? `
            <button class="btn secondary" id="negoReassureBtn">Reassure them — it's coming</button>
            <button class="btn" id="negoPromiseBtn">Promise to prioritize it</button>
          ` : `
            <button class="btn" id="negoDismissBtn">Glad to hear it!</button>
          `}
        </div>
        <p class="sans" style="margin-top:12px;font-size:11.5px;color:#8a8267;">
          ${n.concernType==="budget" ? "Reassuring them costs nothing but risks looking bad if the budget really does run over. A goodwill gesture guarantees a little extra goodwill, win or lose." :
            n.concernType==="musthave" ? "Reassuring them is low-risk. Promising to prioritize it pays off if it actually gets booked before the trip ends — but backfires if it doesn't." :
            "Just a nice check-in — nothing to negotiate here."}
        </p>
      ` : `
        <div class="curveball-banner" style="background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);">📱 "${n.message}"</div>
        <p class="sans" style="margin-top:10px;font-size:12.5px;color:#5b5646;">You responded — this'll factor into how the trip wraps up.</p>
      `}
    </div>`;
  } else if(state.planTab==="budget"){
    const pct = (v)=>Math.min(100, Math.round(v/c.budgetTotal*100));
    tabContent = `
    <div class="brief-panel">
      <h3>Budget breakdown</h3>
      <div class="bar-row"><div class="label"><span>Hotel</span><span>${fmtMoney(spend.hotel)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct(spend.hotel)}%"></div></div></div>
      <div class="bar-row"><div class="label"><span>Tickets</span><span>${fmtMoney(spend.tickets)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct(spend.tickets)}%"></div></div></div>
      <div class="bar-row"><div class="label"><span>Dining</span><span>${fmtMoney(spend.dining)}</span></div><div class="bar-track"><div class="bar-fill dining" style="width:${pct(spend.dining)}%"></div></div></div>
      <div class="bar-row"><div class="label"><span>Springs & merch</span><span>${fmtMoney(spend.merch)}</span></div><div class="bar-track"><div class="bar-fill dining" style="width:${pct(spend.merch)}%"></div></div></div>
      <div class="bar-row"><div class="label"><span>Extras (PhotoPass, events, excursions)</span><span>${fmtMoney(spend.extras)}</span></div><div class="bar-track"><div class="bar-fill ll" style="width:${pct(spend.extras)}%"></div></div></div>
      <div class="bar-row"><div class="label"><span>Lightning Lane</span><span>${fmtMoney(spend.ll)}</span></div><div class="bar-track"><div class="bar-fill ll" style="width:${pct(spend.ll)}%"></div></div></div>
      <div class="bar-total"><span>Total spent</span><span>${fmtMoney(spend.total)} / ${fmtMoney(c.budgetTotal)}</span></div>
    </div>`;
  }

  return `

function currentDayPark(){
  const day = state.days.find(d=>d.dayNumber===state.currentDay);
  if(!day) return null;
  return (day.secondPark && state.trayPark==="second") ? day.secondPark : day.park;
}
function availableActivities(){
  const hotelId = state.hotelId;
  const choices = [];
  Object.entries(RESORT_ACTIVITIES).forEach(([key, act])=>{
    const available = act.availableAt==="all" || (Array.isArray(act.availableAt) && act.availableAt.includes(hotelId));
    if(!available) return;
    act.options.forEach(opt=>{
      choices.push({ id:`${key}__${opt.hours}`, activityKey:key, name:act.name, hours:opt.hours, price:opt.price });
    });
  });
  return choices;
}
function getPickerList(){
  if(state.itemPickerType==="activity") return availableActivities();
  if(state.itemPickerType==="hotelDining"){
    return [{id:"hotel_qs", name:"Hotel quick service", price:[13,16]}, ...(HOTEL_DINING[state.hotelId]||[])];
  }
  const isSnack = state.itemPickerType==="snack";
  if(!isSnack){
    const parkCode = currentDayPark();
    return (SHOPS[parkCode] || SHOPS.MK).items;
  }
  const day = state.days.find(d=>d.dayNumber===state.currentDay);
  const festival = day && day.park==="EPCOT" ? FESTIVALS[state.season] : null;
  return [...SNACKS, ...(state.eventTicket && state.eventTicket!=="none" ? EVENT_TREATS : []), ...(festival ? festival.booths : [])];
}
function renderItemPicker(){
  const type = state.itemPickerType;
  const list = getPickerList();
  const day = state.days.find(d=>d.dayNumber===state.currentDay);
  const festival = type==="snack" && day && day.park==="EPCOT" ? FESTIVALS[state.season] : null;
  const shopName = type==="shop" ? (SHOPS[currentDayPark()] || SHOPS.MK).name : null;
  const title = type==="snack" ? "What are they craving?"
    : type==="shop" ? `Welcome to ${shopName}`
    : type==="activity" ? "How long, and doing what?"
    : "Where should they eat at the resort?";
  return `
    <div class="overlay" id="itemPickerOverlay">
      <div class="drawer" style="width:380px;">
        <h3 style="font-family:var(--serif);font-size:19px;text-transform:none;letter-spacing:0;">${title}</h3>
        ${type==="snack" && festival ? `<p class="sans" style="font-size:11.5px;color:var(--teal-dark);margin-top:2px;">🎪 ${festival.name} booths available today</p>` : ""}
        <div class="sans" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
          ${list.map(s=>`
            <button class="btn secondary" data-item-choice="${s.id}" style="justify-content:space-between;display:flex;text-align:left;">
              <span>${s.name}${s.exclusive?' ⭐':''}${type==='activity'?` — ${s.hours} hr`:''}</span><span>${(!s.price||s.price[1]===0)?'Free':fmtMoney(priceInRange(s.price,"Medium"))}</span>
            </button>`).join("")}
        </div>
        <div style="margin-top:16px;text-align:right;"><button class="btn secondary" id="cancelItemPicker" style="font-size:12px;">Cancel</button></div>
      </div>
    </div>
  `;
}

function buildFamilyLetter(r){
  const c = state.client;
  const overBudget = r.spend.total > c.budgetTotal;
  const openers = {
    great: [`Dear agent,`, `To our wonderful travel agent,`],
    good: [`Dear agent,`, `Hello again,`],
    mixed: [`Dear agent,`, `Hi there,`],
    rough: [`To whom it may concern,`, `Dear agent,`],
  };
  let tier = r.final>=90 ? "great" : r.final>=75 ? "good" : r.final>=60 ? "mixed" : "rough";
  let body;
  if(tier==="great"){
    body = `We just got home and we're still talking about it. Every single thing on our list got booked, and honestly it felt like you read our minds. ${c.size>3?'The whole crew':'We'} can't wait to book with you again.`;
  } else if(tier==="good"){
    body = `We had a wonderful time! Most of what mattered to us made it into the trip, and things mostly ran smoothly. A few small things could've gone better${overBudget?', and the final bill ran a bit higher than we hoped':''}, but overall we're happy we booked with you.`;
  } else if(tier==="mixed"){
    body = `The trip had its ups and downs. We appreciated the effort, but ${overBudget?'we were surprised by how much we ended up spending, and ':''}a few things we really cared about got missed along the way. We'll think it over before booking with you again.`;
  } else {
    body = `We have to be honest — this trip didn't go the way we'd hoped. ${overBudget?"We spent well beyond what we agreed on, and ":""}too many things we asked for just weren't there. We won't be requesting you as our agent next time.`;
  }
  const signoff = tier==="great"||tier==="good" ? `Warmly,\n${c.familyName}` : `Sincerely,\n${c.familyName}`;
  const bm = r.bigMoment;
  const momentLine = bm.met
    ? pick([
        `Honestly, the moment that made this whole trip for us was getting "${bm.label.toLowerCase()}" — that was the one thing we really wanted, and you made it happen.`,
        `If there's one thing we'll remember, it's that you made sure we got "${bm.label.toLowerCase()}." That meant more to us than you probably realize.`,
      ])
    : pick([
        `If we're being honest, the one thing we were really hoping for was "${bm.label.toLowerCase()}," and it just didn't happen this time. That one stung a little.`,
        `We were most looking forward to "${bm.label.toLowerCase()}," so it was disappointing that it never made it into the plan.`,
      ]);
  return `${pick(openers[tier])}\n\n${body}\n\n${momentLine}\n\n${signoff}`;
}

let lastReportPassed = true;
function logTrip(r){
  const c = state.client;
  tripLog.push({
    familyName:c.familyName, archetype:c.archetype.label, size:c.size,
    tripLengthDays:c.tripLengthDays, grade:r.grade, score:r.final,
    budgetTotal:c.budgetTotal, spent:r.spend.total, loggedAt:new Date(),
    hotelId:state.hotelId, hotelName:(HOTELS.find(h=>h.id===state.hotelId)||{}).name || "Unknown",
  });
  tripLog.sort((a,b)=>b.score-a.score);

  // Remember this family for possible future repeat bookings
  const existing = pastClients.find(p=>p.familyName===c.familyName);
  if(existing){ existing.lastGrade = r.grade; existing.quirk = c.quirk; }
  else { pastClients.push({ familyName:c.familyName, quirk:c.quirk, lastGrade:r.grade }); if(pastClients.length>20) pastClients.shift(); }

  // Grade streak, for the streak achievement
  if(r.final>=90) career.streak++; else career.streak=0;

  // Track every A-tier ride ever successfully used with Lightning Lane, for the collection achievement
  state.days.forEach(d=>Object.values(d.items).forEach(it=>{
    if(it.kind==="ride" && it.tier==="A") career.aTierEverBooked.add(it.id);
  }));

  const levelBefore = career.level;
  career.tripsCompleted++;
  awardXp(Math.round(r.final) + (c.archetype && c.archetype.rare ? 40 : 0));
  state.leveledUp = career.level > levelBefore;
  checkAchievements(r, c);
  state.newlyUnlocked = newlyUnlocked;
  saveGame();
}

function generateShareCard(){
  const canvas = document.getElementById("shareCanvas");
  if(!canvas || !lastReportData || !state) return;
  const ctx = canvas.getContext("2d");
  const r = lastReportData, c = state.client;
  const W = canvas.width, H = canvas.height;

  // Background
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,"#FDF9EF"); grad.addColorStop(1,"#F0E6D2");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#1B6169"; ctx.lineWidth = 6; ctx.strokeRect(3,3,W-6,H-6);

  // Header
  ctx.fillStyle = "#123F45"; ctx.font = "bold 22px Georgia";
  ctx.fillText("SUNSHINE & CO. VACATION BUREAU", 40, 55);
  ctx.strokeStyle = "#20302B"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40,68); ctx.lineTo(W-40,68); ctx.stroke();

  // Grade
  ctx.fillStyle = "#1B6169"; ctx.font = "bold 90px Georgia";
  ctx.fillText(r.grade, 40, 190);
  ctx.fillStyle = "#6b6555"; ctx.font = "16px Georgia";
  ctx.fillText(`${r.final} / 100`, 40, 220);

  // Client info
  ctx.fillStyle = "#20302B"; ctx.font = "bold 20px Georgia";
  ctx.fillText(c.familyName, 250, 130);
  ctx.font = "13px Georgia"; ctx.fillStyle = "#443f33";
  ctx.fillText(`${c.archetype.label} · ${c.size} guests · ${c.tripLengthDays}-day trip`, 250, 154);
  ctx.fillText(`Budget: ${fmtMoney(c.budgetTotal)}   Spent: ${fmtMoney(r.spend.total)}`, 250, 176);
  ctx.fillText(`Agent rank: ${careerTitle()} (Level ${career.level+1})`, 250, 198);

  // Category bars
  const cats = [["Budget",r.budgetScore],["Value",r.valueScore],["Preferences",r.prefScore],["Efficiency",r.effScore]];
  let by = 250;
  cats.forEach(([label,score])=>{
    ctx.fillStyle = "#20302B"; ctx.font = "12px Georgia";
    ctx.fillText(`${label}: ${score}`, 40, by);
    ctx.fillStyle = "#e8ddc0"; ctx.fillRect(140, by-11, 200, 10);
    ctx.fillStyle = "#1B6169"; ctx.fillRect(140, by-11, 200*(score/100), 10);
    by += 24;
  });

  ctx.fillStyle = "#8a8267"; ctx.font = "italic 12px Georgia";
  ctx.fillText("A Disney World Travel Agent Simulator — fan-made, non-commercial", 40, H-24);

  const link = document.createElement("a");
  link.download = `${c.familyName.replace(/\s+/g,"_")}_trip_score.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function wireEvents(){
  const goHome = document.getElementById("goHome");
  if(goHome) goHome.onclick = (e)=>{ e.preventDefault(); state=null; render(); };
  const viewLogBtn = document.getElementById("viewLogBtn");
  if(viewLogBtn) viewLogBtn.onclick = ()=>{ state=null; render(); };
  const shareCardBtn = document.getElementById("shareCardBtn");
  if(shareCardBtn) shareCardBtn.onclick = generateShareCard;
  const hintBtn = document.getElementById("hintBtn");
  const passTurnBtn = document.getElementById("passTurnBtn");
  if(passTurnBtn) passTurnBtn.onclick = ()=>{ state.coop.turn = state.coop.turn===1?2:1; render(); };
  if(hintBtn) hintBtn.onclick = ()=>{
    const { tags } = bookedTagSet();
    const c = state.client;
    const unmet = c.mustHaves.filter(t=>!tags.has(t));
    state.hintMsg = unmet.length
      ? `Try working in: ${TAG_LABELS[unmet[0]]||unmet[0]}.`
      : "All their must-haves are already booked — check the budget next.";
    render();
  };
  document.querySelectorAll("[data-difficulty]").forEach(b=>{
    b.onclick = ()=>{ difficulty = b.dataset.difficulty; saveGame(); render(); };
  });
  const howToPlayBtn = document.getElementById("howToPlayBtn");
  if(howToPlayBtn) howToPlayBtn.onclick = ()=>{ showOnboarding = true; render(); };
  const resetSaveBtn = document.getElementById("resetSaveBtn");
  if(resetSaveBtn) resetSaveBtn.onclick = ()=>{ showResetConfirm = true; render(); };
  const confirmResetBtn = document.getElementById("confirmResetBtn");
  if(confirmResetBtn) confirmResetBtn.onclick = ()=>{ resetSaveData(); showResetConfirm=false; render(); };
  const cancelResetBtn = document.getElementById("cancelResetBtn");
  if(cancelResetBtn) cancelResetBtn.onclick = ()=>{ showResetConfirm=false; render(); };
  const prestigeBtn = document.getElementById("prestigeBtn");
  if(prestigeBtn) prestigeBtn.onclick = ()=>{ prestigeUp(); render(); };
  document.querySelectorAll("[data-theme-choice]").forEach(b=>{
    b.onclick = ()=>{ applyTheme(b.dataset.themeChoice); saveGame(); render(); };
  });
  const closeOnboarding = document.getElementById("closeOnboarding");
  if(closeOnboarding) closeOnboarding.onclick = ()=>{ showOnboarding = false; render(); };
  const openAchievementGallery = document.getElementById("openAchievementGallery");
  if(openAchievementGallery) openAchievementGallery.onclick = ()=>{ showAchievementGallery = true; render(); };
  const closeAchievementGallery = document.getElementById("closeAchievementGallery");
  if(closeAchievementGallery) closeAchievementGallery.onclick = ()=>{ showAchievementGallery = false; render(); };
  const openStatsHistory = document.getElementById("openStatsHistory");
  if(openStatsHistory) openStatsHistory.onclick = ()=>{ showStatsHistory = true; render(); };
  const closeStatsHistory = document.getElementById("closeStatsHistory");
  if(closeStatsHistory) closeStatsHistory.onclick = ()=>{ showStatsHistory = false; render(); };
  const openLeaderboard = document.getElementById("openLeaderboard");
  if(openLeaderboard) openLeaderboard.onclick = ()=>{ showLeaderboard = true; loadLeaderboard(); };
  const closeLeaderboard = document.getElementById("closeLeaderboard");
  if(closeLeaderboard) closeLeaderboard.onclick = ()=>{ showLeaderboard = false; render(); };
  const refreshLeaderboard = document.getElementById("refreshLeaderboard");
  if(refreshLeaderboard) refreshLeaderboard.onclick = ()=>{ loadLeaderboard(); };
  const playerNameInput = document.getElementById("playerNameInput");
  if(playerNameInput) playerNameInput.oninput = (e)=>{
    playerName = e.target.value;
    try { localStorage.setItem('sunshineco_playerName', playerName); } catch(err){}
  };
  const playDailyChallenge = document.getElementById("playDailyChallenge");
  if(playDailyChallenge) playDailyChallenge.onclick = ()=>{ startDailyChallenge(); };
  const openDailyLeaderboard = document.getElementById("openDailyLeaderboard");
  if(openDailyLeaderboard) openDailyLeaderboard.onclick = ()=>{ showDailyLeaderboard = true; loadDailyLeaderboard(); };
  const closeDailyLeaderboard = document.getElementById("closeDailyLeaderboard");
  if(closeDailyLeaderboard) closeDailyLeaderboard.onclick = ()=>{ showDailyLeaderboard = false; render(); };
  const refreshDailyLeaderboard = document.getElementById("refreshDailyLeaderboard");
  if(refreshDailyLeaderboard) refreshDailyLeaderboard.onclick = ()=>{ loadDailyLeaderboard(); };
  const showCreateRoomBtn = document.getElementById("showCreateRoomBtn");
  if(showCreateRoomBtn) showCreateRoomBtn.onclick = ()=>{ createOnlineRoom(); };
  const showJoinRoomBtn = document.getElementById("showJoinRoomBtn");
  if(showJoinRoomBtn) showJoinRoomBtn.onclick = ()=>{ onlineH2HUi.mode = "join"; render(); };
  const joinRoomCodeInput = document.getElementById("joinRoomCodeInput");
  if(joinRoomCodeInput) joinRoomCodeInput.oninput = (e)=>{ onlineH2HUi.joinCode = e.target.value.toUpperCase(); };
  const confirmJoinRoomBtn = document.getElementById("confirmJoinRoomBtn");
  if(confirmJoinRoomBtn) confirmJoinRoomBtn.onclick = ()=>{ joinOnlineRoom(onlineH2HUi.joinCode); };
  const checkOnlineRoomBtn = document.getElementById("checkOnlineRoomBtn");
  if(checkOnlineRoomBtn) checkOnlineRoomBtn.onclick = ()=>{ checkOnlineRoom(onlineH2H.code); };
  const leaveOnlineRoomBtn = document.getElementById("leaveOnlineRoomBtn");
  if(leaveOnlineRoomBtn) leaveOnlineRoomBtn.onclick = ()=>{ onlineH2H = null; onlineH2HCompare = { loading:false, error:null, data:null }; render(); };
  const startFromRoomBtn = document.getElementById("startFromRoomBtn");
  if(startFromRoomBtn) startFromRoomBtn.onclick = ()=>{ state.view = "client"; render(); };
  document.querySelectorAll("[data-item-choice]").forEach(b=>{
    b.onclick = ()=>{
      const list = getPickerList();
      const item = list.find(s=>s.id===b.dataset.itemChoice);
      if(state.itemPickerType==="activity"){
        dropItem(state.currentDay, state.pendingItemSlot, {kind:"activity", id:item.activityKey, name:item.name, price:item.price, hours:item.hours});
      } else {
        dropItem(state.currentDay, state.pendingItemSlot, {kind:"dining", restaurant:item});
      }
      state.showItemPicker = false;
      state.pendingItemSlot = null;
      render();
    };
  });
  const cancelItemPicker = document.getElementById("cancelItemPicker");
  if(cancelItemPicker) cancelItemPicker.onclick = ()=>{ state.showItemPicker=false; state.pendingItemSlot=null; render(); };
  const startBooking = document.getElementById("startBooking");
  if(startBooking) startBooking.onclick = ()=>{ ensureAudioCtx(); showOnboarding = false; newGame(); };
  const sfxToggle = document.getElementById("sfxToggle");
  if(sfxToggle) sfxToggle.onchange = (e)=>{ sound.sfxOn = e.target.checked; if(sound.sfxOn) sfxDrop(); saveGame(); };
  const musicToggle = document.getElementById("musicToggle");
  if(musicToggle) musicToggle.onchange = (e)=>{ ensureAudioCtx(); e.target.checked ? startMusicLoop() : stopMusicLoop(); saveGame(); };
  const volumeSlider = document.getElementById("volumeSlider");
  if(volumeSlider) volumeSlider.oninput = (e)=>{ sound.volume = parseFloat(e.target.value); if(sound.musicEl) sound.musicEl.volume = sound.volume*0.5; };
  if(volumeSlider) volumeSlider.onchange = saveGame;

  const startPlan = document.getElementById("startPlan");
  if(startPlan) startPlan.onclick = ()=>{
    if(pendingCoop.enabled){
      state.coop = { agent1: pendingCoop.agent1.trim()||"Agent 1", agent2: pendingCoop.agent2.trim()||"Agent 2", turn:1 };
    } else if(pendingH2H.enabled){
      h2h = { agent1: pendingH2H.agent1.trim()||"Agent 1", agent2: pendingH2H.agent2.trim()||"Agent 2", phase:1, agent1Report:null };
      h2hSeed = JSON.parse(JSON.stringify(state)); // clean snapshot — days are still empty at this point
    } else {
      h2h = null; h2hSeed = null;
    }
    state.view="plan"; render();
  };
  const reroll = document.getElementById("rerollClient");
  if(reroll) reroll.onclick = ()=>newGame();
  const newClientBtn = document.getElementById("newClientBtn");
  if(newClientBtn) newClientBtn.onclick = ()=>newGame();
  const coopToggle = document.getElementById("coopToggle");
  if(coopToggle) coopToggle.onchange = (e)=>{ pendingCoop.enabled = e.target.checked; if(e.target.checked) pendingH2H.enabled = false; render(); };
  const coopName1 = document.getElementById("coopName1");
  if(coopName1) coopName1.oninput = (e)=>{ pendingCoop.agent1 = e.target.value; };
  const coopName2 = document.getElementById("coopName2");
  if(coopName2) coopName2.oninput = (e)=>{ pendingCoop.agent2 = e.target.value; };
  const h2hToggle = document.getElementById("h2hToggle");
  if(h2hToggle) h2hToggle.onchange = (e)=>{ pendingH2H.enabled = e.target.checked; if(e.target.checked) pendingCoop.enabled = false; render(); };
  const h2hName1 = document.getElementById("h2hName1");
  if(h2hName1) h2hName1.oninput = (e)=>{ pendingH2H.agent1 = e.target.value; };
  const h2hName2 = document.getElementById("h2hName2");
  if(h2hName2) h2hName2.oninput = (e)=>{ pendingH2H.agent2 = e.target.value; };
  const submitLeaderboardBtn = document.getElementById("submitLeaderboardBtn");
  if(submitLeaderboardBtn) submitLeaderboardBtn.onclick = ()=>{
    if(!window.firebaseSubmitScore){
      state.leaderboardSubmitMsg = "Couldn't connect to the leaderboard right now.";
      render(); return;
    }
    state.leaderboardSubmitMsg = "Submitting…";
    render();
    window.firebaseSubmitScore({
      playerName: playerName || "Anonymous Agent",
      familyName: state.client.familyName,
      archetype: state.client.archetype.label,
      grade: lastReportData.grade,
      score: lastReportData.final,
      tripLengthDays: state.client.tripLengthDays,
    }).then(res=>{
      if(res.ok){ state.leaderboardSubmitted = true; state.leaderboardSubmitMsg = "Submitted! Check the global leaderboard from the home screen."; }
      else { state.leaderboardSubmitMsg = "Couldn't submit — try again in a moment."; }
      render();
    }).catch(()=>{
      state.leaderboardSubmitMsg = "Couldn't submit — try again in a moment.";
      render();
    });
  };
  const submitDailyBtn = document.getElementById("submitDailyBtn");
  if(submitDailyBtn) submitDailyBtn.onclick = ()=>{
    if(!window.firebaseSubmitDailyChallenge){
      state.dailySubmitMsg = "Couldn't connect to the leaderboard right now.";
      render(); return;
    }
    state.dailySubmitMsg = "Submitting…";
    render();
    window.firebaseSubmitDailyChallenge({
      date: state.dailyChallengeDate,
      playerName: playerName || "Anonymous Agent",
      grade: lastReportData.grade,
      score: lastReportData.final,
    }).then(res=>{
      if(res.ok){ state.dailySubmitted = true; state.dailySubmitMsg = "Submitted! Check today's leaderboard from the home screen."; }
      else { state.dailySubmitMsg = "Couldn't submit — try again in a moment."; }
      render();
    }).catch(()=>{
      state.dailySubmitMsg = "Couldn't submit — try again in a moment.";
      render();
    });
  };
  const submitOnlineH2HBtn = document.getElementById("submitOnlineH2HBtn");
  if(submitOnlineH2HBtn) submitOnlineH2HBtn.onclick = ()=>{
    if(!window.firebaseSubmitH2HReport){
      onlineH2HUi.status = "Couldn't connect to the server right now.";
      render(); return;
    }
    onlineH2HUi.status = "Submitting…";
    render();
    window.firebaseSubmitH2HReport(onlineH2H.code, onlineH2H.role, {
      name: playerName || (onlineH2H.role==="host" ? "Agent 1" : "Agent 2"),
      grade: lastReportData.grade,
      final: lastReportData.final,
      budgetScore: lastReportData.budgetScore,
      valueScore: lastReportData.valueScore,
      prefScore: lastReportData.prefScore,
      effScore: lastReportData.effScore,
    }).then(res=>{
      if(res.ok){ onlineH2H.submitted = true; onlineH2HUi.status = "Submitted! Check results from the home screen."; }
      else { onlineH2HUi.status = "Couldn't submit — try again in a moment."; }
      render();
    }).catch(()=>{
      onlineH2HUi.status = "Couldn't submit — try again in a moment.";
      render();
    });
  };
  const h2hHandoffBtn = document.getElementById("h2hHandoffBtn");
  if(h2hHandoffBtn) h2hHandoffBtn.onclick = ()=>{
    state = JSON.parse(JSON.stringify(h2hSeed));
    h2h.phase = 2;
    state.view = "plan";
    render();
  };
  const h2hNewRoundBtn = document.getElementById("h2hNewRoundBtn");
  if(h2hNewRoundBtn) h2hNewRoundBtn.onclick = ()=>{ newGame(); };
  const h2hBackHomeBtn = document.getElementById("h2hBackHomeBtn");
  if(h2hBackHomeBtn) h2hBackHomeBtn.onclick = ()=>{ h2h=null; h2hSeed=null; state=null; render(); };

  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state.currentDay = parseInt(t.dataset.day); state.trayPark="home"; render(); };
  });
  const parkSelect = document.getElementById("parkSelect");
  if(parkSelect) parkSelect.onchange = (e)=>{
    const day = state.days.find(d=>d.dayNumber===state.currentDay);
    day.park = e.target.value; day.items = {}; day.secondPark = null; state.trayPark = "home"; render();
  };
  const hotelSelect = document.getElementById("hotelSelect");
  if(hotelSelect) hotelSelect.onchange = (e)=>{
    state.hotelId = e.target.value;
    const newHotel = HOTELS.find(h=>h.id===state.hotelId);
    state.roomType = smallestFittingRoomType(newHotel, state.client.size) || newHotel.roomTypes[0];
    render();
  };
  const roomTypeSelect = document.getElementById("roomTypeSelect");
  if(roomTypeSelect) roomTypeSelect.onchange = (e)=>{ state.roomType = e.target.value; render(); };
  const dayTypeSelect = document.getElementById("dayTypeSelect");
  if(dayTypeSelect) dayTypeSelect.onchange = (e)=>{
    const day = state.days.find(d=>d.dayNumber===state.currentDay);
    day.dayType = e.target.value; day.items = {}; render();
  };
  const hopperToggle = document.getElementById("hopperToggle");
  if(hopperToggle) hopperToggle.onchange = (e)=>{
    state.parkHopper = e.target.checked;
    if(!state.parkHopper){ state.days.forEach(d=>d.secondPark=null); state.trayPark="home"; }
    render();
  };
  const secondParkSelect = document.getElementById("secondParkSelect");
  if(secondParkSelect) secondParkSelect.onchange = (e)=>{
    const day = state.days.find(d=>d.dayNumber===state.currentDay);
    day.secondPark = e.target.value || null; state.trayPark = "home"; render();
  };
  const photoPassToggle = document.getElementById("photoPassToggle");
  if(photoPassToggle) photoPassToggle.onchange = (e)=>{ state.photoPass = e.target.checked; render(); };
  const eventTicketSelect = document.getElementById("eventTicketSelect");
  if(eventTicketSelect) eventTicketSelect.onchange = (e)=>{ state.eventTicket = e.target.value; render(); };
  const acceptTextBtn = document.getElementById("acceptTextBtn");
  if(acceptTextBtn) acceptTextBtn.onclick = ()=>{
    const day = state.days.find(d=>d.dayNumber===state.textDay);
    day.dayType = "rest"; day.items = {};
    state.textResolved = true;
    render();
  };
  const declineTextBtn = document.getElementById("declineTextBtn");
  if(declineTextBtn) declineTextBtn.onclick = ()=>{ state.textResolved = true; render(); };
  const negoReassureBtn = document.getElementById("negoReassureBtn");
  if(negoReassureBtn) negoReassureBtn.onclick = ()=>{ state.negotiation.choice = "reassure"; state.negotiation.resolved = true; render(); };
  const negoGoodwillBtn = document.getElementById("negoGoodwillBtn");
  if(negoGoodwillBtn) negoGoodwillBtn.onclick = ()=>{ state.negotiation.choice = "goodwill"; state.negotiation.resolved = true; render(); };
  const negoPromiseBtn = document.getElementById("negoPromiseBtn");
  if(negoPromiseBtn) negoPromiseBtn.onclick = ()=>{ state.negotiation.choice = "promise"; state.negotiation.resolved = true; render(); };
  const negoDismissBtn = document.getElementById("negoDismissBtn");
  if(negoDismissBtn) negoDismissBtn.onclick = ()=>{ state.negotiation.resolved = true; render(); };
  document.querySelectorAll("[data-tray-park]").forEach(b=>{
    b.onclick = ()=>{ state.trayPark = b.dataset.trayPark; render(); };
  });

  document.querySelectorAll("[data-filter]").forEach(b=>{
    b.onclick = ()=>{ state.trayFilter = b.dataset.filter; render(); };
  });

  const openBudget = document.getElementById("openBudget");
  if(openBudget) openBudget.onclick = ()=>{ state.planTab = "budget"; render(); };
  document.querySelectorAll("[data-plan-tab]").forEach(b=>{
    b.onclick = ()=>{ state.planTab = b.dataset.planTab; render(); };
  });

  const finishTrip = document.getElementById("finishTrip");
  if(finishTrip) finishTrip.onclick = ()=>{
    const totalBookings = state.days.reduce((sum,d)=> sum + Object.values(d.items).filter(it=>it.kind==="ride"||it.kind==="dining").length, 0);
    const expectedMin = state.client.tripLengthDays * 2; // rough "barely planned" threshold
    if(totalBookings >= expectedMin){
      state.view="report"; state.reportSoundPlayed=false; render();
    } else {
      state.pendingFinishBookingCount = totalBookings;
      state.showFinishConfirm = true;
      render();
    }
  };
  const confirmFinishBtn = document.getElementById("confirmFinishBtn");
  if(confirmFinishBtn) confirmFinishBtn.onclick = ()=>{
    state.showFinishConfirm = false;
    state.view="report"; state.reportSoundPlayed=false; render();
  };
  const cancelFinishBtn = document.getElementById("cancelFinishBtn");
  if(cancelFinishBtn) cancelFinishBtn.onclick = ()=>{ state.showFinishConfirm = false; render(); };

  document.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick = ()=> removeItem(state.currentDay, b.dataset.remove);
  });
  document.querySelectorAll("[data-ll-toggle]").forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); toggleLL(state.currentDay, a.dataset.llToggle); };
  });

  function placeAtSlot(slotHour, data){
    if(data.kind==="snack" || data.kind==="shop" || data.kind==="activity" || data.kind==="hotelDining"){
      state.pendingItemSlot = slotHour;
      state.itemPickerType = data.kind;
      state.showItemPicker = true;
      render();
      return true;
    }
    if(data.kind==="travel"){
      return dropItem(state.currentDay, slotHour, {kind:"travel", label:data.label});
    } else if(data.kind==="ride"){
      const ride = Object.values(RIDES).flat().find(r=>r.id===data.id);
      return dropItem(state.currentDay, slotHour, {kind:"ride", ride});
    } else {
      const rest = data.id==="hotel_qs" ? {id:"hotel_qs", name:"Hotel quick service", price:[13,16]} : Object.values(RESTAURANTS).flat().find(r=>r.id===data.id);
      return dropItem(state.currentDay, slotHour, {kind:"dining", restaurant:rest});
    }
  }

  document.querySelectorAll(".card").forEach(card=>{
    if(card.dataset.disabled==="true") return; // closed today — no drag/select wiring
    card.ondragstart = (e)=>{
      const label = card.querySelector(".name") ? card.querySelector(".name").textContent : "";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:card.dataset.kind, id:card.dataset.id, label}));

      // Custom drag ghost so it matches the app's look instead of a default browser snapshot
      const ghost = document.createElement("div");
      ghost.textContent = label;
      ghost.style.cssText = `
        position:fixed; top:-999px; left:-999px; z-index:9999;
        font-family:'Work Sans',sans-serif; font-weight:700; font-size:12.5px;
        background:linear-gradient(155deg,#1F7A80,#0B3438); color:#FFFBF2;
        padding:10px 16px; border-radius:10px; box-shadow:0 10px 28px rgba(11,52,56,.4);
        white-space:nowrap; pointer-events:none;
      `;
      document.body.appendChild(ghost);
      e.dataTransfer.setDragImage(ghost, 20, 20);
      setTimeout(()=> ghost.remove(), 0);
    };
    // Tap-to-select fallback — works on touch devices and via keyboard, alongside drag-and-drop
    const selectHandler = ()=>{
      const label = card.querySelector(".name") ? card.querySelector(".name").textContent.trim() : "";
      const kind = card.dataset.kind, id = card.dataset.id;
      if(state.selectedCard && state.selectedCard.kind===kind && state.selectedCard.id===id){
        state.selectedCard = null; // tap again to deselect
      } else {
        state.selectedCard = { kind, id, label };
      }
      render();
    };
    card.onclick = selectHandler;
    card.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectHandler(); } };
  });
  document.querySelectorAll(".slot-drop").forEach(slot=>{
    if(!slot.dataset.slot) return; // spanned continuation slot, not a drop target
    slot.ondragover = (e)=>{ e.preventDefault(); slot.classList.add("dragover"); };
    slot.ondragleave = ()=> slot.classList.remove("dragover");
    slot.ondrop = (e)=>{
      e.preventDefault(); slot.classList.remove("dragover");
      const data = JSON.parse(e.dataTransfer.getData("text/plain"));
      placeAtSlot(slot.dataset.slot, data);
    };
    // Tap-to-place: if a card is selected, tapping/pressing Enter on a slot books it there
    const placeHandler = ()=>{
      if(!state.selectedCard) return;
      const data = state.selectedCard;
      const success = placeAtSlot(slot.dataset.slot, data);
      if(success){ state.selectedCard = null; render(); }
    };
    slot.onclick = placeHandler;
    slot.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); placeHandler(); } };
  });
}

window.addEventListener("beforeunload", (e)=>{
  if(state && state.view==="plan"){
    e.preventDefault();
    e.returnValue = "";
  }
});

loadGame();
render();
</script>
</body>
</html>
